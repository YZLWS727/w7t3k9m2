name: w1

on:
  schedule:
    # 2026-09-21 起：隔日中午窗口推送；错峰时间点 + 脚本内 11:45–15:30 窗口，
    # GitHub 定时派发延迟时会在窗口外静默跳过，不再傍晚打扰
    - cron: "47 3 * * *"   # 北京 11:47
    - cron: "37 4 * * *"   # 北京 12:37
    - cron: "37 5 * * *"   # 北京 13:37
  workflow_dispatch:
    inputs:
      force:
        description: "1 = ignore interval gate"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: w1
  cancel-in-progress: false

jobs:
  w1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: r
        env:
          SRC_URL: ${{ secrets.SRC_URL }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          ENC_KEY: ${{ secrets.ENC_KEY }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_AUX_ENDPOINT: ${{ secrets.S3_AUX_ENDPOINT }}
          S3_AUX_BUCKET: ${{ secrets.S3_AUX_BUCKET }}
          S3_AUX_ACCESS_KEY: ${{ secrets.S3_AUX_ACCESS_KEY }}
          S3_AUX_SECRET_KEY: ${{ secrets.S3_AUX_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python -m pip install --quiet --disable-pip-version-check cryptography
          python z1.py
