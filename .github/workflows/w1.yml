name: w1

on:
  schedule:
    # 2026-09-23 修订：实测 GitHub 把本仓库定时派发推迟约 5 小时（连续 4 天，
    # 11:47/12:37/13:37 三个点全部落在 16:48–18:15 才被派发）→ 原窗口全部错过。
    # 方案：①"提前量套"补偿 5 小时延迟（+5h 后 ≈ 北京 12:27/13:27/14:27 送达）；
    #       ②保留原"准点套"（GitHub 恢复准时则由它们落在标准窗口）；
    #       ③脚本内窗口：标准 11:45–15:30，延迟补推 15:30–21:00（带"延迟补推"标记）。
    - cron: "27 23 * * *"   # 北京 07:27 触发（+5h → 12:27）
    - cron: "27 0 * * *"    # 北京 08:27 触发（+5h → 13:27）
    - cron: "27 1 * * *"    # 北京 09:27 触发（+5h → 14:27）
    - cron: "47 3 * * *"    # 北京 11:47（准点套）
    - cron: "47 4 * * *"    # 北京 12:47（准点套）
    - cron: "47 5 * * *"    # 北京 13:47（准点套）
  workflow_dispatch:
    inputs:
      force:
        description: "1 = ignore interval gate"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: w1
  cancel-in-progress: false

jobs:
  w1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: r
        env:
          SRC_URL: ${{ secrets.SRC_URL }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          ENC_KEY: ${{ secrets.ENC_KEY }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_AUX_ENDPOINT: ${{ secrets.S3_AUX_ENDPOINT }}
          S3_AUX_BUCKET: ${{ secrets.S3_AUX_BUCKET }}
          S3_AUX_ACCESS_KEY: ${{ secrets.S3_AUX_ACCESS_KEY }}
          S3_AUX_SECRET_KEY: ${{ secrets.S3_AUX_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python -m pip install --quiet --disable-pip-version-check cryptography
          python z1.py
